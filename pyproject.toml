[project]
name = "isagog-ontologies"
version = "3.0.0"
description = "Public Isagog OWL ontologies and an offline resource catalog"
requires-python = ">=3.11"
authors = [{ name = "Isagog S.r.l.", email = "info@isagog.com" }]
readme = "README.md"
license = "MIT AND CC-BY-4.0 AND CC-BY-NC-4.0"
license-files = ["LICENSE", "LICENSING.md", "LICENSES/*"]
dependencies = []

[project.urls]
Homepage = "https://ontology.isagog.com"
Repository = "https://github.com/Isagog/isagog-ontology"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/isagog_ontologies"]

[tool.hatch.build.targets.wheel.force-include]
ontologies = "isagog_ontologies/data"
"catalog.json" = "isagog_ontologies/catalog.json"

[tool.hatch.build.targets.sdist]
include = ["python", "ontologies", "catalog.json", "LICENSE", "LICENSING.md", "LICENSES", "README.md", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8", "rdflib>=7.5", "ruff>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
